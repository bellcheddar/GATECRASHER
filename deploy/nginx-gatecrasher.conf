# nginx site for GATECRASHER. provision.sh substitutes __SERVER_NAME__ and installs this to
# /etc/nginx/sites-available/gatecrasher, then certbot --nginx adds the TLS bits.
#
# This app is static: there is no application server, no Python process and no database on
# the droplet. BUILD_SPEC ground rule 2: everything is precomputed on the Mac.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/gatecrasher;
    index index.html;

    # Log to the SHARED access log in the vhost format, which carries $host. The mdeller.com
    # launcher's hit counter globs only the shared logs, so a vhost that writes to a private
    # file, or omits the format name (which silently means 'combined', with no $host), reads
    # a flat zero forever while everything appears to work.
    access_log /var/log/nginx/access.log vhost;

    # The page itself must never be cached hard, or a deploy is invisible: the browser keeps
    # serving the old HTML, which points at the old asset URLs, and nothing changes on screen
    # however many times the reader reloads.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # App modules are imported by other modules, and deploy.sh stamps only the URLs written
    # into index.html, so js/panels/*.js, js/loader.js and the rest carry no version. Cached
    # immutable, a changed module would never reach a returning reader: they revalidate
    # instead, which costs a 304. Vendored libraries are versioned by js/loader.js and stay
    # immutable. This block must come BEFORE the asset block, because nginx uses the first
    # regex location that matches.
    location ~* ^/js/(?!vendor/).+\.js$ {
        add_header Cache-Control "no-cache" always;
    }

    # Assets carry a ?v=<mtime> stamp written by deploy.sh, so a changed file fetches under a
    # new URL and unchanged ones can be cached hard. The vendored libraries are the reason
    # this matters: Mol* alone is 5 MB and Plotly another 4.5 MB.
    location ~* \.(css|js|wasm|png|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The launcher counts a visit by watching for a sub-resource only a rendering browser
    # fetches. A static page with vendored libraries requests nothing else distinctive, so
    # the favicon is the beacon: it gets a SHORT cache, because an immutable one would mean
    # returning visitors never request it and the counter reads a fraction of real traffic.
    location = /icon.svg {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # The data bundles change whenever a paper is recurated, and they are not stamped
    # (the app fetches them by plain path), so they get a short cache instead of an
    # immutable one.
    location /data/ {
        add_header Cache-Control "public, max-age=300" always;
    }

    # NOTE: do not add a `types { application/wasm wasm; }` block here. The droplet's
    # /etc/nginx/mime.types already maps wasm, and a `types` block in a server context
    # REPLACES the whole inherited MIME map rather than adding to it. This config shipped
    # with one, and nginx then served every stylesheet, module, JSON bundle and SVG as
    # application/octet-stream. Browsers refuse stylesheets and ES modules with that type,
    # so the deployed app was blank furniture: no styling, no switcher, no data. Every file
    # still returned 200 and every local check still passed, because Python's http.server
    # guesses types from the extension. Nothing looked wrong until the page was opened.

    # application/wasm is not in nginx's gzip defaults, and RDKit's 6.9 MB wasm went out
    # uncompressed until it was listed here: the single largest item in the page weight.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv text/plain application/wasm;
    gzip_min_length 1024;

    client_max_body_size 1m;
}
